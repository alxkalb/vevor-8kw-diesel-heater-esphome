<line x1="574" y1="580" x2="574" y2="590" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="561" y1="590" x2="587" y2="590" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
