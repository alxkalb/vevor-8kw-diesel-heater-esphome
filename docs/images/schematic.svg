<circle cx="780" cy="600" r="4.5" fill="#1b1b1b"/>
<text x="30" y="700" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="normal">BS170 (TO-92): flat side towards you, pins left to right = Drain – Gate – Source.</text>
<text x="30" y="720" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="normal">DATA idles at about 4.85 V on the tested unit (multimeter); measure yours first. ESP32 pins are NOT 5 V tolerant: never connect DATA to a GPIO directly.</text>
<text x="30" y="740" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="normal">All GND symbols are one net: XL4015 GND, ESP32 GND, power supply GND shared with the heater (controller GND wire not used).</text>
<text x="30" y="760" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="normal">No voltage regulator on the board: the ESP32 dev board provides 3V3 (used for R1). Controller 5 V (red wire) is not used.</text>
<text x="30" y="780" font-size="12" text-anchor="start" fill="#666" font-weight="normal" font-style="italic">Own drawing for this project. Same principle as other open-drain level shifters, but a different parts list and no regulator.</text>
</svg>
