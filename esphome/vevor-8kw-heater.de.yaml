# =============================================================================
# VEVOR 8 kW Diesel-Standheizung (blaues LCD-Bedienteil) -> ESPHome / Home Assistant
# https://github.com/alxkalb/vevor-8kw-diesel-heater-esphome   (Lizenz: MIT)
#
# DEUTSCHE VARIANTE: entspricht Zeichen fuer Zeichen der Version, die auf der
# Heizung getestet wurde (nur das AP-Passwort kommt jetzt aus secrets.yaml).
# Erklaerungen/Kommentare stehen in der englischen Datei vevor-8kw-heater.yaml.
#
# Benoetigte Eintraege in secrets.yaml (siehe secrets.yaml.example):
#   wifi_ssid, wifi_password, ha_api_key, ota_password, ap_password
#
# Pins: GPIO16 = RX (ueber Q2, invertierter Bus), GPIO17 = TX (ueber Q1).
# SICHERHEITSHINWEIS: siehe README.de.md / docs/safety. Nutzung auf eigene Gefahr.
# =============================================================================
esphome:
  name: diesel-heizung
  friendly_name: Diesel Heizung

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Diesel Heizung Fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: pending_cmd
    type: int
    initial_value: '0'
  - id: pending_n
    type: int
    initial_value: '0'
  - id: pending_ms
    type: uint32_t
    initial_value: '0'
  - id: last_b
    type: int
    initial_value: '-1'
  - id: last_a_ms
    type: uint32_t
    initial_value: '0'
  - id: last_tx_ms
    type: uint32_t
    initial_value: '0'
  - id: last_rx_ms
    type: uint32_t
    initial_value: '0'
  - id: last_a2_ms
    type: uint32_t
    initial_value: '0'
  - id: rx_seen
    type: bool
    initial_value: 'false'
  - id: bus_ok
    type: bool
    initial_value: 'false'
  - id: fault_flag
    type: bool
    initial_value: 'false'
  - id: was_active
    type: bool
    initial_value: 'false'
  - id: inact_cnt
    type: int
    initial_value: '0'
  - id: ev_n
    type: int
    initial_value: '0'
  - id: bad_cnt
    type: int
    initial_value: '0'
  - id: bad_len
    type: int
    initial_value: '0'
  - id: bad_pub_ms
    type: uint32_t
    initial_value: '0'
  - id: bad_bits
    type: std::string
    initial_value: '""'
  - id: err_txt
    type: std::string
    initial_value: '""'

sensor:
  - platform: template
    name: "Heizung Stufe"
    id: heater_level
    accuracy_decimals: 0
  - platform: template
    name: "Heizung Spannung"
    id: heater_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 0

text_sensor:
  - platform: template
    name: "Heizung Status"
    id: heater_state
  - platform: template
    name: "Heizung Fehlerstatus"
    id: heater_fault_text
  - platform: template
    name: "Heizung Rohstatus"
    id: heater_raw
    entity_category: diagnostic
  - platform: template
    name: "Heizung Ereignis"
    id: heater_event
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Heizung Lüfter"
    id: heater_fan
    entity_category: diagnostic
  - platform: template
    name: "Heizung Pumpe"
    id: heater_pump
    entity_category: diagnostic
  - platform: template
    name: "Heizung Glühkerze"
    id: heater_glow
    entity_category: diagnostic
  - platform: template
    name: "Heizung Bus aktiv"
    id: heater_bus
    device_class: connectivity
    entity_category: diagnostic

interval:
  - interval: 1s
    then:
      - lambda: |-
          bool ok = id(rx_seen) && ((millis() - id(last_rx_ms)) < 15000);
          if (!ok && id(bus_ok)) {
            id(bus_ok) = false;
            ESP_LOGW("heizung", "Kein gueltiger Frame seit 15 s");
            id(ev).execute(std::string("Kein Signal (15 s ohne Frame)"));
            id(last_b) = -1;
            id(pending_cmd) = 0;
            id(pending_n) = 0;
            id(was_active) = false;
            id(inact_cnt) = 0;
            id(heater_state).publish_state("Kein Signal");
            id(heater_raw).publish_state("----");
            id(heater_level).publish_state(NAN);
            id(heater_fan).publish_state(false);
            id(heater_pump).publish_state(false);
            id(heater_glow).publish_state(false);
          }
          if (ok && !id(bus_ok)) {
            id(bus_ok) = true;
            ESP_LOGI("heizung", "Bus aktiv");
            id(ev).execute(std::string("Bus aktiv"));
          }
          if (id(bad_cnt) > 0 && (millis() - id(bad_pub_ms)) >= 5000) {
            char e[96];
            snprintf(e, sizeof(e), "unlesbar x%d len=%d %s", id(bad_cnt), id(bad_len), id(bad_bits).c_str());
            id(ev).execute(std::string(e));
            id(bad_cnt) = 0;
            id(bad_pub_ms) = millis();
          }
          id(heater_bus).publish_state(ok);
          std::string ftxt = "Keine Fehler";
          if (!ok) ftxt = "Kein Signal";
          else if (id(fault_flag)) {
            ftxt = "Fehler!";
            if (!id(err_txt).empty()) ftxt += " " + id(err_txt);
          }
          if (id(heater_fault_text).state != ftxt) id(heater_fault_text).publish_state(ftxt);

remote_receiver:
  pin:
    number: GPIO16
    mode: INPUT
  idle: 25ms
  filter: 10us
  on_raw:
    then:
      - lambda: |-
          const auto &v = x;
          if (v.size() < 16 || v[0] >= 0) return;
          auto decode = [&](size_t nbits, int &out) -> bool {
            if (v.size() < nbits * 2) return false;
            int val = 0;
            for (size_t b = 0; b < nbits; b++) {
              int s = -v[2 * b];
              int m = v[2 * b + 1];
              if (s > 6500 && s < 9500 && m > 3000 && m < 5200) val = (val << 1) | 1;
              else if (s > 3000 && s < 5200 && m > 6500 && m < 9500) val = val << 1;
              else return false;
            }
            out = val;
            return true;
          };
          auto bits_of = [&](size_t nsym) -> std::string {
            std::string r;
            for (size_t b = 0; b < nsym && 2 * b + 1 < v.size(); b++) {
              int s = -v[2 * b];
              int m = v[2 * b + 1];
              if (s > 6500 && s < 9500 && m > 3000 && m < 5200) r += '1';
              else if (s > 3000 && s < 5200 && m > 6500 && m < 9500) r += '0';
              else r += '?';
            }
            return r;
          };
          int val = 0;
          if (v.size() >= 32) {
            if (!decode(16, val)) {
              id(bad_cnt) += 1;
              id(bad_len) = (int) v.size();
              id(bad_bits) = bits_of(16);
              return;
            }
            uint32_t now = millis();
            id(last_rx_ms) = now;
            id(rx_seen) = true;
            int hi = (val >> 8) & 0xFF;
            int lo = val & 0xFF;
            bool after_a = (now - id(last_a_ms)) < 400;
            bool ours = (now - id(last_tx_ms)) < 700;
            int prev = id(last_b);
            bool changed = (val != prev);
            id(last_b) = val;
            bool now_active = (lo >= 0x40 && lo <= 0x45);
            bool standby = (hi == 0x60 && lo >= 0x0A && lo <= 0x1F);
            bool prev_standby = (prev >= 0 && ((prev >> 8) & 0xFF) == 0x60 && (prev & 0xFF) >= 0x0A && (prev & 0xFF) <= 0x1F);
            bool quiet = (standby && prev_standby);
            bool fault_frame = ((hi & 0xF0) == 0x80);
            int errv = lo & 0x3F;
            bool fault_before = id(fault_flag);
            if (fault_frame) {
              char eb[40];
              if (errv >= 2) snprintf(eb, sizeof(eb), "E-%02d (?)", errv - 1);
              else snprintf(eb, sizeof(eb), "Wert %d", errv);
              std::string et = eb;
              if (!id(fault_flag)) {
                id(fault_flag) = true;
                ESP_LOGW("heizung", "Fehlerframe B=%04X, Wert %d", val, errv);
                id(ev).execute(std::string("FEHLER: Fehlerframe, Wert ") + std::to_string(errv) + " " + et);
              }
              id(err_txt) = et;
              id(was_active) = false;
              id(inact_cnt) = 0;
            } else if (now_active) {
              if (!id(was_active)) {
                id(fault_flag) = false;
                id(err_txt) = "";
              }
              id(was_active) = true;
              id(inact_cnt) = 0;
            } else if (id(was_active)) {
              if ((now - id(last_a2_ms)) < 5000) {
                id(was_active) = false;
                id(inact_cnt) = 0;
              } else {
                id(inact_cnt) += 1;
                if (id(inact_cnt) >= 2) {
                  id(fault_flag) = true;
                  id(was_active) = false;
                  id(inact_cnt) = 0;
                  ESP_LOGW("heizung", "Heizung ungewollt aus (Betrieb beendet ohne A2), B=%04X", val);
                  id(ev).execute(std::string("FEHLER: Betrieb ohne A2 beendet"));
                }
              }
            }
            if (changed || id(fault_flag) != fault_before) {
              if (changed && !quiet) ESP_LOGI("heizung", "B=%04X", val);
              char buf[8];
              snprintf(buf, sizeof(buf), "%04X", val);
              id(heater_raw).publish_state(buf);
              bool fan = (hi & 0x08) != 0;
              bool pump = (hi & 0x04) != 0;
              bool glow = (hi & 0x01) != 0;
              std::string st = "unbekannt";
              if (fault_frame) st = ((lo & 0xC0) == 0xC0) ? "Fehler: Abkuehlen" : "Fehler (Standby)";
              else if (standby) st = id(fault_flag) ? "Standby (nach Fehler)" : "Standby";
              else if (lo == 0xC0) st = id(fault_flag) ? "Abkuehlen (ungewollt)" : "Abkuehlen";
              else if (now_active) {
                if (hi == 0x60) st = "Start angefordert";
                else if (glow && pump) st = "Zuenden";
                else if (glow) st = "Vorgluehen";
                else if (pump) st = "Laeuft";
                else if (fan) st = "Anlauf";
                else st = "Betrieb";
              } else if (id(fault_flag)) st = "unbekannt (Fehler)";
              id(heater_state).publish_state(st);
              id(heater_fan).publish_state(fan);
              id(heater_pump).publish_state(pump);
              id(heater_glow).publish_state(glow);
              if (now_active) id(heater_level).publish_state(lo - 0x3F);
              else id(heater_level).publish_state(NAN);
              if (standby) id(heater_voltage).publish_state(lo);
              if (changed && !quiet) id(ev).execute(st + " (B=" + buf + ")");
            }
            if (id(pending_cmd) != 0 && after_a && !ours) {
              int c = id(pending_cmd);
              if (now - id(pending_ms) > 8000) {
                id(pending_cmd) = 0;
                id(pending_n) = 0;
              } else {
                bool ok = true;
                if (c == 0xA3) ok = (lo >= 0x40 && lo < 0x45);
                if (c == 0xA4) ok = (lo > 0x40 && lo <= 0x45);
                if (ok) {
                  id(last_tx_ms) = now;
                  if (c == 0xA2) id(last_a2_ms) = now;
                  id(send_cmd).execute(c);
                }
                id(pending_n) -= 1;
                if (!ok || id(pending_n) <= 0) {
                  id(pending_cmd) = 0;
                  id(pending_n) = 0;
                }
              }
            }
          } else {
            if (v.size() > 20) {
              id(bad_cnt) += 1;
              id(bad_len) = (int) v.size();
              id(bad_bits) = bits_of(16);
              return;
            }
            if (!decode(8, val) || (val & 0xF0) != 0xA0) {
              id(bad_cnt) += 1;
              id(bad_len) = (int) v.size();
              id(bad_bits) = bits_of(8);
              return;
            }
            uint32_t now = millis();
            id(last_rx_ms) = now;
            id(rx_seen) = true;
            id(last_a_ms) = now;
            if (val == 0xA2) id(last_a2_ms) = now;
            if (val != 0xA6) {
              ESP_LOGI("heizung", "A=%02X (zusaetzlicher Frame, Taste oder eigenes Echo)", val);
              char e[24];
              snprintf(e, sizeof(e), "A=%02X", val);
              id(ev).execute(std::string(e));
            }
          }

remote_transmitter:
  pin: GPIO17
  carrier_duty_percent: 100%

script:
  - id: ev
    mode: queued
    max_runs: 12
    parameters:
      msg: string
    then:
      - lambda: |-
          id(ev_n) += 1;
          char nb[16];
          snprintf(nb, sizeof(nb), "  [#%d]", id(ev_n));
          id(heater_event).publish_state(msg + std::string(nb));
  - id: send_cmd
    mode: single
    parameters:
      cmd: int
    then:
      - delay: 100ms
      - remote_transmitter.transmit_raw:
          code: !lambda |-
            std::vector<int32_t> c;
            c.push_back(30000);
            for (int i = 7; i >= 0; i--) {
              if ((cmd >> i) & 1) { c.push_back(-8000); c.push_back(4000); }
              else { c.push_back(-4000); c.push_back(8000); }
            }
            return c;
      - lambda: |-
          ESP_LOGI("heizung", "TX A=%02X gesendet", cmd);
          char e[24];
          snprintf(e, sizeof(e), "TX A=%02X", cmd);
          id(ev).execute(std::string(e));

button:
  - platform: template
    name: "Heizung EIN"
    on_press:
      - lambda: |-
          int b = id(last_b);
          int hi = (b >> 8) & 0xFF;
          int lo = b & 0xFF;
          bool standby = (hi == 0x60 && lo >= 0x0A && lo <= 0x1F);
          bool fault_standby = (hi == 0x80 && (lo & 0xC0) == 0);
          if (b >= 0 && (standby || fault_standby)) {
            id(pending_cmd) = 0xA2;
            id(pending_n) = 1;
            id(pending_ms) = millis();
          } else {
            ESP_LOGW("heizung", "EIN ignoriert, Heizung nicht im Standby (B=%04X)", b);
            id(ev).execute(std::string("Taste EIN ignoriert"));
          }
  - platform: template
    name: "Heizung AUS"
    on_press:
      - lambda: |-
          int b = id(last_b);
          int lo = b & 0xFF;
          if (b >= 0 && lo >= 0x40 && lo <= 0x45) {
            id(pending_cmd) = 0xA2;
            id(pending_n) = 1;
            id(pending_ms) = millis();
          } else {
            ESP_LOGW("heizung", "AUS ignoriert, Heizung laeuft nicht (B=%04X)", b);
            id(ev).execute(std::string("Taste AUS ignoriert"));
          }
  - platform: template
    name: "Heizung Stufe plus"
    on_press:
      - lambda: |-
          int b = id(last_b);
          int lo = b & 0xFF;
          if (b >= 0 && lo >= 0x40 && lo < 0x45) {
            if (id(pending_cmd) == 0xA3) {
              if (id(pending_n) < 6) id(pending_n) += 1;
            } else {
              id(pending_cmd) = 0xA3;
              id(pending_n) = 1;
            }
            id(pending_ms) = millis();
          } else {
            ESP_LOGW("heizung", "Stufe plus ignoriert (B=%04X)", b);
            id(ev).execute(std::string("Taste Stufe plus ignoriert"));
          }
  - platform: template
    name: "Heizung Stufe minus"
    on_press:
      - lambda: |-
          int b = id(last_b);
          int lo = b & 0xFF;
          if (b >= 0 && lo > 0x40 && lo <= 0x45) {
            if (id(pending_cmd) == 0xA4) {
              if (id(pending_n) < 6) id(pending_n) += 1;
            } else {
              id(pending_cmd) = 0xA4;
              id(pending_n) = 1;
            }
            id(pending_ms) = millis();
          } else {
            ESP_LOGW("heizung", "Stufe minus ignoriert (B=%04X)", b);
            id(ev).execute(std::string("Taste Stufe minus ignoriert"));
          }
